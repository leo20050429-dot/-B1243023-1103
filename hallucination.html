<h1>幻覺（Hallucination）</h1>
<p class="definition">AI 產生看起來很合理、實際上卻是錯誤或憑空捏造的內容。</p>
<h2>為什麼重要</h2><p>AI 的語氣通常很有自信，如果直接採信，可能把錯誤的引用或數據寫進作業與研究。</p>
<h2>生活或課堂中的例子</h2><p>請 AI 列參考文獻時，它可能給出作者與標題都像真的、但根本不存在的論文，所以每一筆都要自己點開確認。</p>
<h2>常見迷思</h2><p>迷思：越新的模型就完全不會幻覺。模型只是比較少出錯，重要資訊仍要查證。</p>
