<h1>提示工程（Prompt Engineering）</h1>
<p class="definition">用清楚的文字告訴 AI 你要什麼，讓它更穩定地給出好答案。</p>
<h2>為什麼重要</h2><p>同一個問題，問法不同，AI 的答案品質可能差很多。學會描述角色、任務、格式與限制，就能少走很多冤枉路。</p>
<h2>生活或課堂中的例子</h2><p>寫報告時，與其只問「幫我寫摘要」，不如說「你是助教，請用 3 點條列這篇論文的研究方法，每點不超過 30 字」。</p>
<h2>常見迷思</h2><p>迷思：有一句萬能咒語就能得到完美答案。實際上提示需要依任務反覆修改與測試。</p>
