<h1>檢索增強生成（RAG）</h1>
<p class="definition">先從資料庫找出相關資料，再讓 AI 根據這些資料回答。</p>
<h2>為什麼重要</h2><p>RAG 讓 AI 能引用最新或私有的資料，並降低憑空捏造的機率，是企業與校園問答機器人常見的做法。</p>
<h2>生活或課堂中的例子</h2><p>學校做一個課程問答機器人，AI 回答前會先搜尋課程大綱與公告，再根據找到的內容回覆同學。</p>
<h2>常見迷思</h2><p>迷思：用了 RAG 就一定正確。若檢索到的資料不相關或有誤，答案仍然會出錯。</p>
